name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff checks
        run: ruff check .

      - name: Start MiniStack
        run: |
          REDIS_HOST=localhost python -m hypercorn ministack.app:app --bind 0.0.0.0:4566 --keep-alive 75 > ministack.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_ministack/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MiniStack did not become healthy within 30s" >&2
          tail -n 200 ministack.log || true
          exit 1

      - name: Pytest (parallel-safe set)
        run: pytest tests/ -v -n 3 --dist=loadfile -m "not serial"

      - name: Pytest (serial set)
        run: pytest tests/ -v --tb=short -m "serial"

      - name: Upload MiniStack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ministack-log-py${{ matrix.python-version }}
          path: ministack.log
