# MiniStack + Dashboard — full local AWS emulator stack
# Usage: docker compose up --build -d
# Dashboard → http://localhost:9090
# MiniStack → http://localhost:4566

services:
  ministack:
    build:
      context: .
      dockerfile: Dockerfile
    image: bogdaniurea/ministack:real-infra
    container_name: ministack
    ports:
      - "4566:4566"
    environment:
      - GATEWAY_PORT=4566
      - LOG_LEVEL=INFO
      - S3_PERSIST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ../ministack-dashboard
      dockerfile: Dockerfile
    image: ministackorg/dashboard:dev
    container_name: ministack-dashboard
    ports:
      - "9090:9090"
    environment:
      - MINISTACK_ENDPOINT=http://ministack:4566
      - MINISTACK_REGION=us-east-1
      - MINISTACK_HOST=0.0.0.0
      - MINISTACK_PORT=9090
    depends_on:
      ministack:
        condition: service_healthy
    restart: unless-stopped
